services:
  cognition-project:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env.example
      - .env  # Optional - override defaults with real credentials
    environment:
      - TARGET_REPO_PATH=/repo
    volumes:
      - cognition-data:/data
      # Checkout of the repo under review. Bandit and the tests run here.
      - ${TARGET_REPO_HOST_PATH:-../superset}:/repo
    restart: unless-stopped

volumes:
  cognition-data:
